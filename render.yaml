# Render Blueprint: one Node web service. In the Render dashboard: New → Blueprint → this repo.
# Secrets marked `sync: false` are entered in the dashboard (never committed).
services:
  - type: web
    name: say-voice
    runtime: node
    plan: free # free instances sleep when idle; the first request after a nap takes ~1 min
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -H 0.0.0.0 # no seed: this app shows only invoices it sent. The disk is wiped on deploy.
    healthCheckPath: /api/kit/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24" # what ran on Render; .node-version says 26
      - key: PAYPAL_MODE
        value: sandbox # or mock (no credentials needed). Anything else refuses to start.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false # create a webhook for https://<service>.onrender.com/api/paypal/webhooks first
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PAYPAL_SANDBOX_SELLER_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false # speech to text. The microphone needs HTTPS, which Render provides.
      - key: AI_DAILY_CAP_USD
        value: "2"
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "6"
      - key: AI_RATE_LIMIT_PER_DAY
        value: "60"
